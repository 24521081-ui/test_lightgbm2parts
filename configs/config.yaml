# Các đường dẫn tương đối tính từ thư mục project, không phụ thuộc nơi gọi lệnh.
data_dir: data/raw
results_dir: results
chunk_size: 500
smoke_items: 30
seed: 42
use_prices: false
# Khi bật giá: chỉ dùng giá đã quan sát đến origin, giữ nguyên cho 28 ngày.
price_policy: last_known
horizon: 28
validation_origin: 1885
test_origin: 1913
classifier:
  objective: binary
  learning_rate: 0.05
  n_estimators: 200
  num_leaves: 31
  random_state: 42
  n_jobs: 6
  device_type: cpu
  force_col_wise: true
  deterministic: true
  verbosity: -1
regressor:
  objective: regression
  learning_rate: 0.05
  n_estimators: 200
  num_leaves: 31
  random_state: 42
  n_jobs: 6
  device_type: cpu
  force_col_wise: true
  deterministic: true
  verbosity: -1
